<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>恋色パレット</title>
    <!-- 外部CSSファイルの読み込み -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- フルスクリーン描画用のキャンバス -->
        <canvas id="gameCanvas"></canvas>
        
        <!-- 最初の質問画面 -->
        <div id="ui-layer">
            <!-- パスを images/logo.png に変更 -->
            <img id="game-logo" src="images/logo.png" alt="恋色パレット">
            
            <h2 id="question-text">あなたには彼女がいますか？</h2>
            <div class="button-container">
                <button id="btn-yes">はい</button>
                <button id="btn-no">いいえ</button>
            </div>
        </div>

        <!-- メッセージ用テキストボックス -->
        <div id="message-layer">
            <div id="message-box">
                <span id="message-text"></span>
                <span class="blink-mark">▼</span>
            </div>
        </div>
    </div>
    
    <script type="module" src="src/main.js"></script>
</body>
</html>
