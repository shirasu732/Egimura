<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>恋色パレット</title>
    <!-- 外部CSSファイルの読み込み -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- フルスクリーン描画用のキャンバス -->
        <canvas id="gameCanvas"></canvas>
        
        <!-- BGM用オーディオ要素 -->
        <audio id="bgm-title" src="./audio/bgm_title.mp3" loop preload="auto"></audio>

        <!-- 1. タイトル画面 -->
        <div id="title-layer" class="ui-screen fade-in">
            <img id="game-logo" src="images/logo.png" alt="恋色パレット">
            
            <div class="menu-container">
                <button id="btn-start" class="menu-btn">ゲーム開始</button>
                <button id="btn-load" class="menu-btn">つづきから</button>
                <button id="btn-exit" class="menu-btn">終了</button>
            </div>

            <!-- 音量コントロール（初期値 20%） -->
            <div class="volume-container">
                <label for="volume-slider" class="volume-label">🎵 BGM音量: <span id="volume-value">20%</span></label>
                <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.2">
            </div>
        </div>

        <!-- 2. 質問画面 -->
        <div id="question-layer" class="ui-screen" style="display: none;">
            <h2 id="question-text">あなたには彼女がいますか？</h2>
            <div class="button-container">
                <button id="btn-yes" class="choice-btn">はい</button>
                <button id="btn-no" class="choice-btn">いいえ</button>
            </div>
        </div>

        <!-- 3. メッセージ用テキストボックス -->
        <div id="message-layer" style="display: none;">
            <div id="message-box">
                <span id="message-text"></span>
                <span class="blink-mark">▼</span>
            </div>
        </div>
    </div>
    
    <script type="module" src="src/main.js"></script>
</body>
</html>
