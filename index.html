<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Egimura Game</title>
    <style>
        /* フルスクリーン対応 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            font-family: sans-serif;
        }
        
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
        }

        /* 質問画面のUI層 */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.85);
            color: white;
        }

        /* ▼ 質問文の文字サイズ拡大 */
        #question-text {
            font-size: 40px;
            margin-bottom: 30px;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .button-container {
            margin-top: 10px;
        }

        /* ▼ ボタンのサイズと文字サイズを拡大 */
        button {
            font-size: 26px;
            font-weight: bold;
            margin: 0 20px;
            padding: 15px 40px;
            border-radius: 8px;
            border: 2px solid white;
            background-color: #333;
            color: white;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
        }

        button:hover {
            background-color: #555;
            transform: scale(1.05);
        }

        /* ノベルゲーム風テキストボックスのUI層 */
        #message-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 50px;
        }

        /* ▼ メッセージボックスの文字サイズをさらに拡大（28px -> 36px） */
        #message-box {
            width: 90%;
            max-width: 1100px;
            height: 250px;             /* 大文字に対応 */
            background-color: rgba(0, 0, 30, 0.9);
            border: 5px solid white;   /* 枠線をくっきり極太に */
            border-radius: 15px;
            padding: 30px 50px;
            box-sizing: border-box;
            color: white;
            font-size: 36px;           /* 大きく視認性をアップ */
            line-height: 1.5;
            font-weight: bold;
            position: relative;
            cursor: pointer;
            white-space: pre-wrap;
            word-break: break-word;

            /* 文章を上下左右中央揃え */
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            
            /* 文字に陰影をつけてくっきり表示 */
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.9);
            box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.5);
        }

        /* ▼ 点滅マークも大きく調整 */
        .blink-mark {
            position: absolute;
            bottom: 20px;
            right: 30px;
            font-size: 28px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <!-- 最初の質問画面 -->
        <div id="ui-layer">
            <h2 id="question-text">あなたには彼女がいますか？</h2>
            <div class="button-container">
                <button id="btn-yes">はい</button>
                <button id="btn-no">いいえ</button>
            </div>
        </div>

        <!-- メッセージ用テキストボックス -->
        <div id="message-layer">
            <div id="message-box">
                <span id="message-text"></span>
                <span class="blink-mark">▼</span>
            </div>
        </div>
    </div>
    
    <script type="module" src="src/main.js"></script>
</body>
</html>
